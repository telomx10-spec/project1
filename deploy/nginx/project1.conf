# project1 리버스 프록시 설정
# 설치 위치: /etc/nginx/conf.d/project1.conf
# 외부( http://103.55.191.157 :80 ) -> nginx -> 내부 Node 앱(127.0.0.1:3001)
#
# 업스트림: Node HTTP 서버
upstream project1_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    # default_server: 0.0.0.0:80 의 모든 요청(공인 IP 직접 접속 포함)을 이 블록이 받음.
    # 설치 스크립트가 기존 nginx.conf 기본 블록의 default_server 를 제거해 충돌을 막음.
    listen 80 default_server;
    listen [::]:80 default_server;

    # 공인 IP로 바로 접속. 도메인이 생기면 IP 대신 도메인으로 바꾸세요.
    server_name 103.55.191.157;

    # 접근 로그 (문제 진단용)
    access_log /var/log/nginx/project1.access.log;
    error_log  /var/log/nginx/project1.error.log;

    # 업로드/요청 본문 크기 상한 (필요시 조정)
    client_max_body_size 10m;

    location / {
        proxy_pass http://project1_backend;

        # 원본 클라이언트 정보 전달 (앱에서 실제 IP/호스트 식별용)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / keep-alive 지원 (지금 앱엔 불필요하지만 무해)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # 타임아웃
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # 백엔드가 죽었을 때 nginx가 502 대신 잠깐 재시도
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}

